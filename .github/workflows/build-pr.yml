name: Build — PR preview

# Builds a testable RC image on every push to a PR targeting develop.
# Tag: rc-<short-sha>  (same convention as release/* branches)
# The image tag is posted/updated as a PR comment after each build.

on:
  pull_request:
    branches: [develop]
    paths:
      - "cmd/**"
      - "internal/**"
      - "Dockerfile"
      - "go.mod"
      - "go.sum"

jobs:
  gateway:
    name: Gateway — build & push rc image
    runs-on: actions-runner-controller
    permissions:
      packages: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Compute tag and image name
        id: meta
        run: |
          SHA="${GITHUB_SHA::7}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=rc-${SHA}"                                >> $GITHUB_OUTPUT
          echo "image=ghcr.io/${OWNER}/kevent-ai/gateway"    >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          build-args: VERSION=${{ steps.meta.outputs.tag }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Post image tag on PR
        uses: actions/github-script@v7
        with:
          script: |
            const image = `${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}`;
            const body = [
              '**Gateway RC image ready for testing:**',
              '```',
              image,
              '```',
              `Commit: \`${{ github.sha }}\``,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = 'Gateway RC image ready for testing';
            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
