# Knative JobSink for async transcription jobs.
#
# JobSink creates one Kubernetes Job per incoming CloudEvent. The relay runs as
# a one-shot binary: it reads the event from /etc/jobsink-event/event (mounted
# automatically by the JobSink controller), processes the job, and exits.
#
# Exit semantics:
#   exit 0  — success or permanent inference failure (result published to Kafka)
#   exit 1  — transient infrastructure error (S3, Kafka, network) → Job retries
#
# One JobSink can serve multiple KafkaSources (e.g. async + priority topics).
#
# Apply in the namespace where your InferenceService runs:
#   kubectl apply -f examples/jobsink.yaml
#
# Replace all <placeholder> values before applying.
---
apiVersion: sinks.knative.dev/v1alpha1
kind: JobSink
metadata:
  name: <jobsink-name>  # e.g. kevent-transcription-jobsink
spec:
  job:
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 3        # retries on exit 1 (transient infra errors)
      activeDeadlineSeconds: 14400  # 4h hard limit; adjust to your inference timeout
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: relay
              image: ghcr.io/ia-generative/kevent-ai/relay:v0.6.0
              imagePullPolicy: IfNotPresent
              env:
                - name: CONFIG_PATH
                  value: /etc/kevent/config.yaml
                # Inference service URL — points to the shared InferenceService predictor.
                # For KServe: http://<inference-service-name>-predictor.<namespace>.svc.cluster.local
                - name: INFERENCE_BASE_URL
                  value: "http://<inference-service-predictor-url>"
                - name: RESULT_TOPIC
                  value: jobs.whisper-large-v3.results
                - name: KAFKA_BROKERS
                  value: "<kafka-bootstrap-address>"
                - name: KAFKA_SASL_MECHANISM
                  value: "SCRAM-SHA-512"
                - name: KAFKA_TLS_ENABLED
                  value: "true"
                - name: KAFKA_CA_CERT_PATH
                  value: /etc/kafka-tls/ca.crt
                - name: KAFKA_SASL_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: <relay-secret-name>
                      key: username
                - name: KAFKA_SASL_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: <relay-secret-name>
                      key: password
                - name: S3_BUCKET
                  value: <s3-bucket-name>
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: <s3-secret-name>
                      key: access-key
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: <s3-secret-name>
                      key: secret-key
                # Optional: AES-256-GCM encryption for S3 objects (must match gateway)
                - name: ENCRYPTION_KEY
                  valueFrom:
                    secretKeyRef:
                      name: kevent-encryption-key
                      key: ENCRYPTION_KEY
                      optional: true
              volumeMounts:
                - name: kevent-config
                  mountPath: /etc/kevent
                  readOnly: true
                - name: kafka-tls
                  mountPath: /etc/kafka-tls
                  readOnly: true
                # /etc/jobsink-event is mounted automatically by the JobSink controller
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "256Mi"
          volumes:
            - name: kevent-config
              configMap:
                name: <relay-configmap-name>  # ConfigMap holding relay/config.yaml
            - name: kafka-tls
              secret:
                secretName: <kafka-ca-secret-name>
