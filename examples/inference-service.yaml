# KServe InferenceService + ServingRuntime example for a Whisper transcription service.
#
# The InferenceService is now a standalone service shared by:
#   - sync requests: proxied directly by the gateway (POST /v1/audio/transcriptions)
#   - async requests: called over the network by relay Jobs (JobSink)
#
# The relay sidecar has been removed. Set minReplicas: 1 to keep the model warm
# for sync requests, or 0 to allow scale-to-zero (first request after idle has
# cold start latency while the model loads).
#
# Apply in the namespace where your InferenceService runs:
#   kubectl apply -f examples/inference-service.yaml
#
# Replace all <placeholder> values before applying.
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: kevent-transcription
  annotations:
    autoscaling.knative.dev/target-utilization-percentage: "100"
spec:
  predictor:
    labels:
      networking.knative.dev/visibility: cluster-local
    maxReplicas: 2
    minReplicas: 1  # keep model warm for sync requests; set to 0 to allow scale-to-zero
    containerConcurrency: 1  # one inference at a time per GPU pod
    model:
      modelFormat:
        name: whisper
      name: ''
      resources:
        requests:
          cpu: '1'
          memory: 16Gi
          nvidia.com/gpu: '1'
        limits:
          cpu: '2'
          memory: 32Gi
          nvidia.com/gpu: '1'
      runtime: whisper-runtime
      storageUri: pvc://<model-pvc-name>  # PVC containing model weights
    scaleMetric: concurrency
    scaleTarget: 1
    timeout: 14400  # 4h — must cover the longest possible inference job
---
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: whisper-runtime
spec:
  containers:
    # ── Inference model ───────────────────────────────────────────────────────
    - name: kserve-container
      image: <your-whisper-api-image>  # e.g. ghcr.io/your-org/whisper-api:latest-gpu
      imagePullPolicy: IfNotPresent
      env:
        - name: HTTP_PORT
          value: '9000'
        - name: MODEL_NAME
          value: whisper
        - name: MODEL_DIR
          value: /mnt/models
      volumeMounts:
        - mountPath: /mnt/models
          name: kserve-pvc-source

  protocolVersions:
    - v1
  supportedModelFormats:
    - autoSelect: true
      name: whisper
      version: '1'

  volumes:
    - name: kserve-pvc-source
      persistentVolumeClaim:
        claimName: <model-pvc-name>
