# Knative KafkaSources for a transcription service using the whisper-large-v3 model.
#
# Two sources are required per model:
#   - async:    normal async jobs        → JobSink (creates one K8s Job per event)
#   - priority: SA/high-priority async  → same JobSink (separate topic, same processing)
#
# Both sources point to the same JobSink. Each incoming CloudEvent creates an
# independent Kubernetes Job, which natural distributes work across nodes without
# the scaling bug that affected the sidecar model.
#
# The sync-over-Kafka source has been removed. POST /v1/* sync requests are now
# proxied directly to the InferenceService by the gateway.
#
# Prerequisites:
#   - The kevent-relay KafkaUser secret must be copied to the InferenceService namespace.
#     The secret must contain keys: sasl-type, username, password.
#   - The Kafka CA certificate secret must also be available in the namespace.
#   - The JobSink must be deployed before applying these sources (see examples/jobsink.yaml).
#
# Apply in the namespace where your InferenceService runs:
#   kubectl apply -f examples/jobsink.yaml
#   kubectl apply -f examples/kafka-sources.yaml
#
# Replace:
#   - <kafka-bootstrap-address>  with your broker address (e.g. kafka-bootstrap.kafka.svc.cluster.local:9093)
#   - <jobsink-name>             with your JobSink name (e.g. kevent-transcription-jobsink)
#   - <relay-secret-name>        with the name of the secret holding relay Kafka credentials
#   - <kafka-ca-secret-name>     with the name of the secret holding the Kafka CA certificate
---
apiVersion: sources.knative.dev/v1
kind: KafkaSource
metadata:
  name: kafka-source-whisper-large-v3
spec:
  bootstrapServers:
    - <kafka-bootstrap-address>
  consumerGroup: inference-whisper-large-v3-async
  topics:
    - jobs.whisper-large-v3.input
  ordering: unordered
  net:
    sasl:
      enable: true
      type:
        secretKeyRef:
          name: <relay-secret-name>
          key: sasl-type
      user:
        secretKeyRef:
          name: <relay-secret-name>
          key: username
      password:
        secretKeyRef:
          name: <relay-secret-name>
          key: password
    tls:
      enable: true
      caCert:
        secretKeyRef:
          name: <kafka-ca-secret-name>
          key: ca.crt
  sink:
    ref:
      apiVersion: sinks.knative.dev/v1alpha1
      kind: JobSink
      name: <jobsink-name>
---
apiVersion: sources.knative.dev/v1
kind: KafkaSource
metadata:
  name: kafka-source-whisper-large-v3-priority
spec:
  bootstrapServers:
    - <kafka-bootstrap-address>
  consumerGroup: inference-whisper-large-v3-priority
  topics:
    - jobs.whisper-large-v3.priority
  ordering: unordered
  net:
    sasl:
      enable: true
      type:
        secretKeyRef:
          name: <relay-secret-name>
          key: sasl-type
      user:
        secretKeyRef:
          name: <relay-secret-name>
          key: username
      password:
        secretKeyRef:
          name: <relay-secret-name>
          key: password
    tls:
      enable: true
      caCert:
        secretKeyRef:
          name: <kafka-ca-secret-name>
          key: ca.crt
  sink:
    ref:
      apiVersion: sinks.knative.dev/v1alpha1
      kind: JobSink
      name: <jobsink-name>
